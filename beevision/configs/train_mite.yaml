# BeeVision mite-classifier training config.
#
# Consumed by `python -m beevision.models.mite.train --config <path>`.
# Data paths resolve through `data_config` (same yaml all ingests use).

seed: 1337
data_config: configs/data.yaml
sources:                       # combined train/val/test across both sources
  - varroa
  - beeimage

model:
  num_classes: 2               # binary: no_mite vs mite
  backbone: resnet50           # torchvision resnet50, ~25M params
  pretrained: true             # ImageNet weights via torchvision DEFAULT
  freeze_backbone: false       # ~11k train images — fine-tune everything
  dropout: 0.0                 # optional pre-FC dropout

train:
  image_size: 224              # native ResNet-50 size; matches data.yaml crop=224
  batch_size: 64
  num_workers: 4
  epochs: 20
  lr: 3.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.0
  mixed_precision: true        # autocast on CUDA, no-op on CPU
  grad_clip: 1.0
  val_every: 1
  use_weighted_sampler: true   # balance combined train set across {no_mite, mite}

checkpoint:
  subdir: checkpoints/mite           # under $BEEVISION_ROOT/processed/
  best_metric: balanced_accuracy     # robust to class skew
  patience: null                     # disable early stop; set int to enable
