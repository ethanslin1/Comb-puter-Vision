# BeeVision data pipeline configuration.
#
# Every path in the pipeline is derived from $BEEVISION_ROOT + the subdirs below.
# Override BEEVISION_ROOT in the environment; the default resolves $USER at runtime.

seed: 1337

root:
  env_var: BEEVISION_ROOT
  default: /oscar/scratch/${USER}/beevision

subdirs:
  raw: raw
  interim: interim
  processed: processed
  cache: cache
  logs: interim/_logs
  debug: interim/_debug
  sanity: interim/_sanity

image_sizes:
  frame_short_edge: 512     # resize frames so short edge == 512 (preserve aspect)
  crop: 224                 # per-cell / per-bee crop side

# Per-source knobs. Each entry MUST have `raw_dir` (directory under raw/).
sources:

  deepbee_cls:
    raw_dir: deepbee-classification
    labels_train: labels_train.csv
    labels_test: labels_test.csv
    images_manifest: images_urls.csv
    # Fraction of train carved out as val (stratified, seeded).
    val_fraction: 0.15
    # Portuguese -> unified English labels. DS-COMB-PT ships labels in PT.
    label_map:
      eggs: egg
      egg: egg
      larves: larva
      larvas: larva
      larva: larva
      capped: capped_brood
      capped_brood: capped_brood
      operculado: capped_brood
      pollen: pollen
      polen: pollen
      nectar: nectar
      nectar_: nectar
      honey: honey
      mel: honey
      other: other
      outros: other

  deepbee_seg:
    raw_dir: deepbee-segmentation
    images_dir: Images
    annotations_dir: Annotations
    # The 61 frames have no preset split → stratified 70/15/15 on a tercile
    # bucket of foreground fraction (seed=1337). This keeps background-heavy
    # vs fg-heavy frames balanced across splits.
    val_fraction: 0.15
    test_fraction: 0.15
    # Class-index convention for single-channel mask PNGs.
    #
    # NOTE ON TASK SHAPE: The Mendeley/DS-COMB annotations on disk are
    # JPEG-compressed 3-channel images where R=G=B at every pixel, and the
    # palette is effectively binary: ~50% pixels at gray≈0 (background) and
    # ~50% at gray≈255 (comb). The remaining ~0.2% are mid-gray values
    # produced by JPEG compression at cell boundaries. We therefore treat
    # this source as BINARY foreground segmentation (bg vs comb), which
    # matches the DeepBee paper's two-stage design (binary seg → per-cell
    # classification handled by deepbee_cls). The decoder thresholds at
    # gray >= threshold_gray and logs the ambiguous pixel fraction per
    # frame. If a frame's ambiguous fraction exceeds abort_frac_above,
    # ingestion aborts loudly (per spec's fail-loud rule).
    classes:
      - background
      - comb
    threshold_gray: 128
    abort_frac_above: 0.02   # abort if >2% of pixels fall in gray [32, 223]
    channel_consistency_tol: 8  # abort if max |R−G| or |R−B| exceeds this

  varroa:
    raw_dir: varroa-mite-detection
    labels_file: gt.csv
    # Zip ships its own train/val/test dirs — respect them.

  beeimage:
    raw_dir: beeimage
    labels_file: bee_data.csv
    # Kaggle archive double-nests the images folder.
    images_dir: bee_imgs/bee_imgs
    # Case-insensitive substring match against the `health` column. Rows that
    # match no pattern are DROPPED per spec ("healthy + Varroa only"). Note
    # the dataset has a typo ("varrao") — both spellings count as mite.
    health_keep_patterns:
      - pattern: healthy
        label: no_mite
      - pattern: varroa
        label: mite
      - pattern: varrao
        label: mite
    splits:
      train: 0.70
      val: 0.15
      test: 0.15

shards:
  size_bytes: 268435456       # 256 MiB
  pattern: "{source}-{split}-%06d.tar"
