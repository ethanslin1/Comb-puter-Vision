[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beevision"
version = "0.1.0"
description = "CV pipeline for beehive frame health assessment (cell segmentation, Varroa detection, colony scoring)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Drone" },
    { name = "Waggle" },
]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "Pillow>=10.0",
    "albumentations>=1.4",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "hydra-core>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "wandb>=0.16",
    "grad-cam>=1.5",
    "lime>=0.2.0.1",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.9",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
